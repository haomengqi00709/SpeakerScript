name: Build & Push RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runpod
      - transcriber.py
      - runpod_handler.py
      - requirements.txt
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: ghcr.io/haomengqi00709/speakerscript-worker:latest
